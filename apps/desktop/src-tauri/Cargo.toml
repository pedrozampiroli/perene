[package]
name = "perene-desktop"
description = "Perene v2 — shell Tauri (cliente fino). No M0 fala PTY direto; do M1 em diante, fala com o daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Necessário para `tauri android`/`ios` no futuro e para lib+bin padrão do Tauri 2.
[lib]
name = "perene_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
base64 = { workspace = true }

perene-protocol = { workspace = true }
perene-core = { workspace = true }

[features]
# Feature default do Tauri para produção (habilita custom-protocol).
custom-protocol = ["tauri/custom-protocol"]
