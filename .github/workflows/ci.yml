name: CI

on:
  push:
    branches: [main, "feat/**"]
    # Sem isto o workflow nunca via uma tag, e a condição `refs/tags/v` do job
    # de bundle era código morto: `git push --tags` não disparava nada.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Compilar + testar nas 3 plataformas (mínimo do M6).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar deps do sistema (Linux/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar deps do front
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck do front
        working-directory: apps/desktop
        run: npm run check

      - name: Build do front
        working-directory: apps/desktop
        run: npm run build

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace

  # Gerar instaladores. `targets: "all"` no tauri.conf faz cada runner produzir
  # tudo que a sua plataforma suporta: .dmg no mac, .msi + .exe (NSIS) no
  # Windows, .deb + .rpm + .AppImage no Linux.
  #
  # Flatpak NÃO sai daqui: o Tauri não empacota flatpak — precisa de manifesto
  # próprio e `flatpak-builder`, normalmente com publicação no Flathub. Fica de
  # fora até alguém querer manter isso.
  bundle:
    name: bundle (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar deps do sistema (Linux/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar deps do front
        working-directory: apps/desktop
        run: npm ci

      - name: Tauri build (instalador)
        working-directory: apps/desktop
        shell: bash
        # O `bundle_dmg.sh` do mac falha de forma intermitente: o `hdiutil` não
        # consegue destacar o volume e o .dmg não sai (o .app sai normal). Sem
        # retry, a release sairia sem o macOS. Antes de tentar de novo é preciso
        # desmontar o volume que ficou pendurado — senão a segunda tentativa
        # esbarra no mesmo bloqueio.
        run: |
          npm run tauri build && exit 0
          echo "::warning::primeiro build falhou; limpando e tentando de novo"
          if [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil info | awk '/\/Volumes\/Perene/ {print $1}' | xargs -r -n1 hdiutil detach -force || true
          fi
          npm run tauri build

      # Pacote nativo do Arch a partir do .deb já construído (mesmo binário).
      # Roda num container porque `makepkg` só existe no Arch; o runner é
      # x86_64, então não há emulação no meio.
      #
      # Não é AUR: AUR é um repositório de receitas e exige conta. Isto é o
      # pacote pronto, anexado à release — o usuário faz `pacman -U`.
      - name: Pacote do Arch (.pkg.tar.zst)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          mkdir -p /tmp/arch
          cp packaging/arch/PKGBUILD /tmp/arch/
          cp target/release/bundle/deb/*.deb /tmp/arch/perene.deb
          VER=$(node -p "require('./apps/desktop/package.json').version")
          docker run --rm -v /tmp/arch:/pkg -e VER="$VER" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m b && cp -r /pkg /home/b/w && chown -R b /home/b/w
            cd /home/b/w
            sed -i "s/^pkgver=.*/pkgver=$VER/" PKGBUILD
            su b -c "makepkg -f --nodeps --noconfirm"
            # Instala de verdade: se o pacote estiver quebrado, o job falha aqui
            # em vez de a release sair com um .pkg.tar.zst que ninguém instala.
            pacman -U --noconfirm --nodeps *.pkg.tar.zst
            test -x /usr/bin/perene-desktop
            pacman -Qi perene | head -3
            cp *.pkg.tar.zst /pkg/
          '
          mkdir -p target/release/bundle/arch
          cp /tmp/arch/*.pkg.tar.zst target/release/bundle/arch/

      # `error` e não `ignore`: com `ignore`, um bundle que falhou virava um
      # artefato vazio e a release saía sem aquela plataforma, em silêncio.
      - name: Subir artefatos
        uses: actions/upload-artifact@v4
        with:
          name: perene-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.pkg.tar.zst

  # Publica os instaladores numa Release do GitHub: artefato de Action expira e
  # exige login para baixar; a release dá link público e permanente.
  release:
    name: release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artefatos/**/*
          body: |
            > **macOS e Windows**: os binários não são assinados com conta de
            > desenvolvedor, então o sistema avisa que não conseguiu verificar o
            > app. No macOS, depois de arrastar para Aplicativos:
            > `xattr -dr com.apple.quarantine /Applications/Perene.app`
