[package]
name = "perene-daemon"
description = "Servidor de sessões: 1 PTY por pane, sobrevive à UI. IPC JSON-lines."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
perene-protocol = { workspace = true }
perene-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
portable-pty = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Named pipes + I/O sobreposto: o IPC do daemon no Windows (crates/.../winpipe.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
base64 = { workspace = true }
perene-protocol = { workspace = true }
