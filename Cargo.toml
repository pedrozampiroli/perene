# Perene v2 — Cargo workspace
#
# Toda a lógica de negócio vive em crates Rust puros (perene-core, perene-protocol,
# perene-daemon). A UI (apps/desktop/src-tauri) é descartável: um cliente fino do
# daemon. Isso permite migrar pra uma UI nativa (iced/gpui) no futuro sem reescrever
# o core.
[workspace]
resolver = "2"
members = [
    "crates/perene-protocol",
    "crates/perene-core",
    "crates/perene-daemon",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pedro Zampiroli <zampiroli.pedroh@gmail.com>"]
repository = "https://github.com/pedrozampiroli/perene"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` por causa dos arquivos de config das CLIs (ver
# perene-core::harness): lemos o JSON do usuário, mudamos só a nossa chave e
# regravamos — sem isso o serde alfabetiza tudo e o ~/.claude.json de 42 KB
# vira um diff inteiro.
#
# `arbitrary_precision` resolveria também o drift de float, mas quebra o resto
# do workspace: com ela, `Number` vira mapa e qualquer struct nossa com f64
# (o `ratio` do LayoutNode) para de desserializar. Os números são preservados
# de outro jeito, com RawValue — ver `write_json_key`.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
base64 = "0.22"
toml = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

perene-protocol = { path = "crates/perene-protocol" }
perene-core = { path = "crates/perene-core" }

# Perfil de release enxuto — RAM/binário pequenos são requisito do projeto.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
